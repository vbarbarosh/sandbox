<script>
const STORAGE_KEY = 'practice_v1';
/* the sandbox's key: one theme for both pages */
const THEME_KEY = 'codesandbox_theme';
const SPLIT_KEY = 'practice_split';
const SPLIT_PANE_MIN_PX = 300;
const SPLIT_BAR_PX = 12;
const SAVE_FORMAT = 'practice-v1';
const HISTORY_LIMIT = 3000;
const CASE_SILENCE_MS = 4000;
const EXAMPLES_COUNT = 3;
const PHP_RUN_LIMIT_MS = 15000;
const DIAGRAM_NODES_LIMIT = 160;
const LEVEL_NAMES = ['', 'Easy', 'Medium', 'Hard'];
const LANG_NAMES = {js: 'JavaScript', php: 'PHP'};

/* the sandbox keeps a workspace per key: every solution here is also a file of its workspace "Practice" */
const SANDBOX_WORKSPACES_KEY = 'codesandbox_workspaces';
const SANDBOX_PRACTICE_ID = 'practice';
const SANDBOX_PRACTICE_KEY = 'codesandbox_spa_v1@practice';

/* PHP runs as it does in the sandbox: php-wasm in a Worker of a hidden sandboxed iframe */
const PHP_WASM_URL = 'https://cdn.jsdelivr.net/npm/php-wasm@0.2.0/PhpWeb.mjs';
const PHP_WASM_LIBS = [
    {name: 'libxml2.so', url: 'https://cdn.jsdelivr.net/npm/php-wasm-libxml@0.2.0/libxml2.so', ini: false},
    {name: 'php8.4-xml.so', url: 'https://cdn.jsdelivr.net/npm/php-wasm-xml@0.2.0/php8.4-xml.so', ini: true},
    {name: 'php8.4-dom.so', url: 'https://cdn.jsdelivr.net/npm/php-wasm-dom@0.2.0/php8.4-dom.so', ini: true},
    {name: 'php8.4-simplexml.so', url: 'https://cdn.jsdelivr.net/npm/php-wasm-simplexml@0.2.0/php8.4-simplexml.so', ini: true},
    {name: 'libonig.so', url: 'https://cdn.jsdelivr.net/npm/php-wasm-mbstring@0.2.0/libonig.so', ini: false},
    {name: 'php8.4-mbstring.so', url: 'https://cdn.jsdelivr.net/npm/php-wasm-mbstring@0.2.0/php8.4-mbstring.so', ini: true},
];
const PHP_CASE_MARK = '@@practice-case@@';

const topic_by_uid = topics_index_by_uid(PRACTICE_TOPICS);

let editor = null;
/* the topic whose code the editor holds: none until the first topic is loaded, nor after a state is loaded in place of this one */
let editor_topic_uid = null;
let draft_timer = 0;
let storage_timer = 0;
let toast_timer = 0;
let toast_undo = null;
let run_seq = 0;
let php_job_seq = 0;
const worker_by_slot = {};
let php_runner = null;
let history_open_time = null;
let drag_depth = 0;

const state = {
    tab: 'topics',
    topic_uid: PRACTICE_TOPICS[0].uid,
    lang: 'js',
    lang_wanted: 'js',
    search: '',
    hints_shown: 0,
    is_solution_shown: false,
    drafts: {},
    solved: {},
    history: [],
    pane: 'task',
    split: 0.5,
    cases: [],
    case_index: 0,
    run_status: 'idle',
    run_mode: 'run',
    run_indexes: [],
    is_storage_failing: false,
};

main();

function main()
{
    storage_read();
    if (!topic_by_uid[state.topic_uid]) {
        state.topic_uid = PRACTICE_TOPICS[0].uid;
    }
    editor = CodeMirror(document.getElementById('editor'), {
        lineNumbers: true,
        indentUnit: 4,
        tabSize: 4,
        indentWithTabs: false,
        autoCloseBrackets: true,
        matchBrackets: true,
        extraKeys: {
            'Ctrl-Enter': click_run,
            'Cmd-Enter': click_run,
            'Shift-Ctrl-Enter': click_submit,
            'Shift-Cmd-Enter': click_submit,
            'Ctrl-/': 'toggleComment',
            'Cmd-/': 'toggleComment',
            'Tab': editor_indent,
        },
    });
    editor.on('change', change_editor);
    events_wire();
    split_read();
    refresh_theme_button();
    const route_topic = topic_by_uid[route_name_read()];
    if (route_topic) {
        state.topic_uid = route_topic.uid;
    }
    topic_open(state.topic_uid);
    route_apply();
    refresh_catalog_note();
    refresh_tab();
    refresh_split();
}

function events_wire()
{
    document.getElementById('tab-topics').addEventListener('click', () => tab_open('topics'));
    document.getElementById('tab-history').addEventListener('click', () => tab_open('history'));
    document.getElementById('back-btn').addEventListener('click', () => tab_open('topics'));
    document.getElementById('random-btn').addEventListener('click', click_random);
    document.getElementById('save-btn').addEventListener('click', click_save);
    document.getElementById('load-btn').addEventListener('click', () => document.getElementById('load-input').click());
    document.getElementById('load-input').addEventListener('change', change_load_input);
    document.getElementById('theme-btn').addEventListener('click', click_theme);
    window.addEventListener('storage', theme_sync);
    window.addEventListener('pageshow', theme_sync);
    document.getElementById('search').addEventListener('input', input_search);
    document.getElementById('search').addEventListener('keydown', keydown_search);
    document.getElementById('catalog-view').addEventListener('click', click_topic_list);
    document.getElementById('lang-js').addEventListener('click', () => lang_switch('js'));
    document.getElementById('lang-php').addEventListener('click', () => lang_switch('php'));
    document.getElementById('pane-tab-task').addEventListener('click', () => pane_open('task'));
    document.getElementById('pane-tab-tests').addEventListener('click', () => pane_open('tests'));
    document.getElementById('pane-tab-explanation').addEventListener('click', () => pane_open('explanation'));
    document.getElementById('split-bar').addEventListener('pointerdown', pointerdown_split);
    document.getElementById('split-bar').addEventListener('keydown', keydown_split);
    document.getElementById('split-bar').addEventListener('dblclick', () => split_set(0.5));
    document.getElementById('run-btn').addEventListener('click', click_run);
    document.getElementById('submit-btn').addEventListener('click', click_submit);
    document.getElementById('reset-btn').addEventListener('click', click_reset);
    document.getElementById('case-chips').addEventListener('click', click_case_chips);
    document.getElementById('topic-hints').addEventListener('click', click_hints);
    document.getElementById('topic-solution').addEventListener('click', click_solution);
    document.getElementById('history-body').addEventListener('click', click_history);
    document.getElementById('toast-undo').addEventListener('click', click_toast_undo);
    document.addEventListener('keydown', keydown_document);
    document.addEventListener('dragenter', dragenter_document);
    document.addEventListener('dragleave', dragleave_document);
    document.addEventListener('dragover', dragover_document);
    document.addEventListener('drop', drop_document);
    window.addEventListener('beforeunload', storage_write);
    window.addEventListener('popstate', popstate_window);
}

/* ---------- topics ---------- */

function topic_open(uid)
{
    const topic = topic_by_uid[uid];
    draft_flush();
    if (worker_by_slot.attempt) {
        worker_by_slot.attempt.finish(null);
    }
    run_seq += 1;
    state.topic_uid = uid;
    state.hints_shown = 0;
    state.is_solution_shown = false;
    state.lang = ((state.lang_wanted === 'php') && topic.solution_php) ? 'php' : 'js';
    state.cases = topic.cases.map(v => ({item: v, status: 'idle', expected: undefined, actual: undefined, args: v.args, message: null, logs: []}));
    state.case_index = 0;
    state.run_status = 'idle';
    state.run_indexes = [];
    state.pane = is_topic_started(uid) ? 'tests' : 'task';
    editor_load();
    refresh_pane();
    refresh_topic();
    refresh_topic_list();
    refresh_cases();
    refresh_run_summary();
    storage_write_soon();
    expected_fill(topic);
}

function topics_index_by_uid(topics)
{
    const out = {};
    for (const topic of topics) {
        out[topic.uid] = topic;
    }
    return out;
}

function topic_find_active()
{
    return topic_by_uid[state.topic_uid];
}

function langs_solved_of(uid)
{
    return Object.keys(state.solved[uid] || {});
}

/* a topic with a draft or a solution opens on Solve, a new one on its task */
function is_topic_started(uid)
{
    return !!state.drafts[uid] || !!state.solved[uid];
}

function pane_open(pane)
{
    state.pane = pane;
    refresh_pane();
}

function topics_match(search)
{
    const words = search.toLowerCase().split(/\s+/).filter(Boolean);
    return PRACTICE_TOPICS.filter(function (topic) {
        const text = `${topic.title} ${topic.group} ${topic.fn} ${topic.brief}`.toLowerCase();
        return words.every(v => text.includes(v));
    });
}

function click_topic_list(event)
{
    const link = event.target.closest('[data-topic]');
    if (!link) {
        return;
    }
    topic_open(link.dataset.topic);
    tab_open('topic');
}

function input_search(event)
{
    state.search = event.target.value;
    refresh_topic_list();
}

/* Enter opens the first topic the search matches */
function keydown_search(event)
{
    if (event.key !== 'Enter') {
        return;
    }
    const topics = topics_match(state.search);
    if (!state.search.trim() || !topics.length) {
        return;
    }
    event.preventDefault();
    topic_open(topics[0].uid);
    tab_open('topic');
}

/* a random topic not solved yet in the language at hand; once all are, any other one */
function click_random()
{
    const others = PRACTICE_TOPICS.filter(v => v.uid !== state.topic_uid);
    const open = others.filter(v => !(state.solved[v.uid] || {})[state.lang]);
    const pool = open.length ? open : others;
    const topic = pool[Math.floor(Math.random()*pool.length)];
    topic_open(topic.uid);
    tab_open('topic');
}

function click_hints(event)
{
    if (!event.target.closest('[data-hint-more]')) {
        return;
    }
    state.hints_shown += 1;
    refresh_hints();
}

function click_solution(event)
{
    if (!event.target.closest('[data-solution-toggle]')) {
        return;
    }
    state.is_solution_shown = !state.is_solution_shown;
    refresh_solution();
}

/* ---------- the editor and drafts ---------- */

function editor_load()
{
    const topic = topic_find_active();
    editor_topic_uid = topic.uid;
    const draft = (state.drafts[topic.uid] || {})[state.lang];
    editor.setOption('mode', (state.lang === 'php') ? 'application/x-httpd-php' : 'javascript');
    editor.setValue((typeof draft === 'string') ? draft : starter_from_topic(topic, state.lang));
    editor.clearHistory();
    const lines = editor.getValue().split('\n');
    const body_line = lines.indexOf('    ');
    editor.setCursor((body_line >= 0) ? {line: body_line, ch: 4} : {line: lines.length - 1, ch: 0});
}

function change_editor()
{
    clearTimeout(draft_timer);
    draft_timer = setTimeout(draft_flush, 400);
}

function editor_indent(cm)
{
    if (cm.somethingSelected()) {
        cm.indentSelection('add');
        return;
    }
    cm.replaceSelection('    ', 'end');
}

/* the code in the editor becomes the draft of its topic; the starter code itself is no draft */
function draft_flush()
{
    clearTimeout(draft_timer);
    draft_timer = 0;
    const topic = topic_by_uid[editor_topic_uid];
    if (!editor || !topic) {
        return;
    }
    const code = editor.getValue();
    const drafts = state.drafts[topic.uid] || {};
    if (code === starter_from_topic(topic, state.lang)) {
        delete drafts[state.lang];
    }
    else {
        drafts[state.lang] = code;
    }
    if (Object.keys(drafts).length) {
        state.drafts[topic.uid] = drafts;
    }
    else {
        delete state.drafts[topic.uid];
    }
    storage_write_soon();
}

function starter_from_topic(topic, lang)
{
    if (lang === 'php') {
        return `<?php\n\n${signature_of(topic, lang)}\n{\n    \n}\n`;
    }
    return `${signature_of(topic, lang)}\n{\n    \n}\n`;
}

function signature_of(topic, lang)
{
    if (lang === 'php') {
        return `function ${topic.fn}(${topic.params.map(v => `$${v}`).join(', ')})`;
    }
    return topic.signature;
}

function click_reset()
{
    editor.setValue(starter_from_topic(topic_find_active(), state.lang));
    editor.focus();
    draft_flush();
}

function lang_switch(lang)
{
    if ((lang === state.lang) || ((lang === 'php') && !topic_find_active().solution_php)) {
        return;
    }
    draft_flush();
    state.lang = lang;
    state.lang_wanted = lang;
    for (const item of state.cases) {
        item.status = 'idle';
        item.actual = undefined;
        item.message = null;
        item.logs = [];
    }
    state.run_status = 'idle';
    editor_load();
    refresh_topic();
    refresh_topic_list();
    refresh_cases();
    refresh_run_summary();
    storage_write_soon();
}

/* ---------- running the tests ---------- */

/* the expected values come from the reference solution, run on the same args before any attempt */
function expected_fill(topic)
{
    const run_id = ++run_seq;
    worker_run({run_id, source: '', reference: topic.solution, fn: topic.fn, observe: topic.observe, check: topic.check, is_pure: topic.is_pure, cases: topic.cases, time_limit_ms: time_limit_of(topic), is_reference_only: true}, function (message) {
        if ((run_id !== run_seq) || (state.topic_uid !== topic.uid)) {
            return;
        }
        const item = state.cases[message.index];
        item.expected = message.expected;
        item.args = message.args || item.args;
        if (message.status === 'error') {
            item.message = message.message;
        }
        if (message.index === state.case_index) {
            refresh_case_detail();
        }
    });
}

function click_run()
{
    tests_run('run');
}

function click_submit()
{
    tests_run('submit');
}

/* Run tries the code and keeps nothing; only Submit counts: the History, the solved mark, the sandbox's file */
function tests_run(mode)
{
    if (state.run_status === 'running') {
        return;
    }
    draft_flush();
    pane_open('tests');
    const topic = topic_find_active();
    const code = editor.getValue();
    const indexes = case_indexes_of_run(mode);
    for (const item of state.cases) {
        item.status = 'idle';
        item.actual = undefined;
        item.message = null;
        item.logs = [];
    }
    for (const index of indexes) {
        state.cases[index].status = 'running';
    }
    state.run_status = 'running';
    state.run_mode = mode;
    state.run_indexes = indexes;
    refresh_cases();
    refresh_run_summary();
    if (state.lang === 'php') {
        php_tests_run(topic, code, indexes);
        return;
    }
    const run_id = ++run_seq;
    const cases = indexes.map(v => topic.cases[v]);
    const job = {run_id, source: code, reference: topic.solution, fn: topic.fn, observe: topic.observe, check: topic.check, is_pure: topic.is_pure, cases, time_limit_ms: time_limit_of(topic)};
    worker_run(job, function (message) {
        if (run_id !== run_seq) {
            return;
        }
        case_result_set(indexes[message.index], message);
    }).then(function () {
        if (run_id === run_seq) {
            run_finish(topic, 'js', code);
        }
    });
}

/* Run takes the examples, the first tests of a topic, and the test shown beside the editor; Submit takes them all */
function case_indexes_of_run(mode)
{
    if (mode === 'submit') {
        return [...state.cases.keys()];
    }
    const out = [...state.cases.keys()].slice(0, EXAMPLES_COUNT);
    if (!out.includes(state.case_index)) {
        out.push(state.case_index);
    }
    return out;
}

function case_result_set(index, result)
{
    const item = state.cases[index];
    item.status = result.status;
    if (result.expected !== undefined) {
        item.expected = result.expected;
    }
    item.actual = result.actual;
    item.message = result.message || null;
    item.logs = result.logs || [];
    refresh_case_chip(index);
    if (index === state.case_index) {
        refresh_case_detail();
    }
}

/* one run is done: the first case it failed is shown; a Submit is kept */
function run_finish(topic, lang, code)
{
    for (const item of state.cases) {
        if (item.status === 'running') {
            item.status = 'skipped';
        }
    }
    const passed = state.run_indexes.filter(v => state.cases[v].status === 'pass').length;
    const total = state.run_indexes.length;
    state.run_status = (passed === total) ? 'pass' : 'fail';
    const failed_index = state.run_indexes.find(v => state.cases[v].status !== 'pass');
    if (failed_index !== undefined) {
        state.case_index = failed_index;
    }
    if (state.run_mode === 'submit') {
        submission_save(topic, lang, code, passed, total);
    }
    refresh_cases();
    refresh_run_summary();
}

/* a Submit goes into the history and the sandbox's Practice workspace; a full pass marks the topic solved */
function submission_save(topic, lang, code, passed, total)
{
    const time = new Date().toISOString();
    if (passed === total) {
        state.solved[topic.uid] = Object.assign({}, state.solved[topic.uid], {[lang]: time});
    }
    state.history.unshift({time, topic_uid: topic.uid, lang, passed, total, code});
    state.history.length = Math.min(state.history.length, HISTORY_LIMIT);
    sandbox_practice_write(topic, lang, code);
    storage_write();
    refresh_topic();
    refresh_topic_list();
    refresh_progress();
    if (state.tab === 'history') {
        refresh_history();
    }
}

/* how long the attempt on one case may run, once its reference has: 4 s, or what the topic sets for its big data */
function time_limit_of(topic)
{
    return topic.time_limit_ms || CASE_SILENCE_MS;
}

/* runs a job in a Worker of its own; a case silent for too long ends the Worker, and the run with it */
function worker_run(job, on_case)
{
    const slot = job.is_reference_only ? 'expected' : 'attempt';
    if (worker_by_slot[slot]) {
        worker_by_slot[slot].finish(null);
    }
    return new Promise(function (resolve) {
        let silence_timer = 0;
        let next_index = 0;

        const url = URL.createObjectURL(new Blob([`(${practice_worker_main.toString()})();`], {type: 'text/javascript'}));
        const worker = new Worker(url);
        const running = {finish};
        worker_by_slot[slot] = running;
        worker.onmessage = function (event) {
            const message = event.data;
            if (message.done) {
                finish(null);
                return;
            }
            if (message.is_reference_done) {
                silence_wait();
                return;
            }
            next_index = message.index + 1;
            on_case(message);
            silence_wait();
        };
        worker.onerror = function (event) {
            event.preventDefault();
            finish(event.message || 'The browser could not run the code.');
        };
        silence_wait();
        worker.postMessage(job);
        function silence_wait() {
            clearTimeout(silence_timer);
            silence_timer = setTimeout(() => finish(`Time limit exceeded: no answer in ${job.time_limit_ms/1000} s. An endless loop, or too many steps?`), job.time_limit_ms);
        }
        function finish(error_message) {
            clearTimeout(silence_timer);
            worker.terminate();
            URL.revokeObjectURL(url);
            if (worker_by_slot[slot] === running) {
                delete worker_by_slot[slot];
            }
            if (error_message && (next_index < job.cases.length)) {
                on_case({run_id: job.run_id, index: next_index, status: job.is_reference_only ? 'error' : 'timeout', message: error_message, logs: []});
            }
            resolve();
        }
    });
}

/* ---------- PHP: the cases go in as JSON, each result comes back as a line of JSON on stdout ---------- */

async function php_tests_run(topic, code, indexes)
{
    const run_id = ++run_seq;
    const cases = indexes.map(v => topic.cases[v]);
    const prepared = [];
    await worker_run({run_id, source: '', reference: topic.solution, fn: topic.fn, observe: topic.observe, check: topic.check, is_pure: topic.is_pure, cases, time_limit_ms: time_limit_of(topic), is_reference_only: true}, function (message) {
        prepared[message.index] = message;
    });
    if (run_id !== run_seq) {
        return;
    }
    const harness = php_harness_render(topic);
    const files = [
        {path: 'snippets/solution.php', content: code},
        {path: 'snippets/cases.json', content: JSON.stringify(prepared.map(v => v.args))},
    ];
    const result = await php_run(harness, files);
    if (run_id !== run_seq) {
        return;
    }
    const observed_by_index = php_cases_from_stdout(result.stdout || '');
    const crash = crash_text_from_php(result);
    prepared.forEach(function (reference, i) {
        const index = indexes[i];
        const observed = observed_by_index[i];
        if (!observed) {
            case_result_set(index, {status: 'error', expected: reference.expected, message: crash || 'The script stopped before this case.', logs: []});
            return;
        }
        const logs = observed.output ? observed.output.split('\n').filter(Boolean) : [];
        if (observed.error) {
            case_result_set(index, {status: 'error', expected: reference.expected, message: observed.error, logs});
            return;
        }
        const is_matched = is_value_equal(observed.observed, reference.expected);
        const message = is_matched ? flaw_text_from_php(topic, observed) : null;
        case_result_set(index, {status: (is_matched && !message) ? 'pass' : 'fail', expected: reference.expected, actual: observed.observed, message, logs});
    });
    run_finish(topic, 'php', code);
}

/* a result can be equal to the expected one and still break a rule of the topic */
function flaw_text_from_php(topic, observed)
{
    if (observed.flaw) {
        return observed.flaw;
    }
    if (topic.is_pure && observed.is_changed) {
        return 'The arguments were changed. This function must leave its input untouched.';
    }
    return null;
}

function php_harness_render(topic)
{
    const observe_by_name = {
        result: '$result',
        node: '(is_object($result) ? [\'node\' => $result->uid] : $result)',
        edit: '[\'returned\' => $result, \'tree\' => $args[0]]',
    };
    const flaw_by_check = {
        same_node: 'if (is_object($result) && !in_array($result, practice_nodes($args[0]), true)) { $out[\'flaw\'] = \'Return the node object from the tree itself, not a copy of it.\'; }',
        fresh_nodes: 'if (array_intersect(array_map(\'spl_object_id\', practice_nodes($result)), array_map(\'spl_object_id\', practice_nodes($args[0])))) { $out[\'flaw\'] = \'The result shares node objects with the input. Build new nodes for it.\'; }',
    };
    const lines = [
        '<?php',
        'ob_start();',
        'require \'/snippets/solution.php\';',
        'ob_end_clean();',
        `if (!function_exists('${topic.fn}')) {`,
        `    echo "No function named ${topic.fn} was found. Keep the name from the starter code.";`,
        '    return;',
        '}',
        'function practice_nodes($root)',
        '{',
        '    $out = [];',
        '    $stack = [$root];',
        '    while ($stack) {',
        '        $node = array_pop($stack);',
        '        if (is_object($node) && isset($node->children) && is_array($node->children)) {',
        '            $out[] = $node;',
        '            array_push($stack, ...array_reverse($node->children));',
        '        }',
        '    }',
        '    return $out;',
        '}',
        '$cases = json_decode(file_get_contents(\'/snippets/cases.json\'));',
        'foreach ($cases as $index => $args) {',
        `    $args = array_pad($args, ${topic.params.length}, null);`,
        '    $before = json_encode($args);',
        '    $out = [\'index\' => $index];',
        '    ob_start();',
        '    try {',
        `        $result = ${topic.fn}(...$args);`,
        `        $out['observed'] = ${observe_by_name[topic.observe]};`,
        `        ${flaw_by_check[topic.check] || ''}`,
        '    }',
        '    catch (Throwable $error) {',
        '        $out[\'error\'] = get_class($error) . \': \' . $error->getMessage();',
        '    }',
        '    $out[\'output\'] = ob_get_clean();',
        '    $out[\'is_changed\'] = (json_encode($args) !== $before);',
        `    echo "\\n${PHP_CASE_MARK}" . json_encode($out, JSON_PARTIAL_OUTPUT_ON_ERROR) . "\\n";`,
        '}',
    ];
    return lines.join('\n');
}

function php_cases_from_stdout(stdout)
{
    const out = {};
    for (const line of stdout.split('\n')) {
        if (!line.startsWith(PHP_CASE_MARK)) {
            continue;
        }
        try {
            const item = JSON.parse(line.slice(PHP_CASE_MARK.length));
            out[item.index] = item;
        }
        catch {
        }
    }
    return out;
}

/* what PHP said when it stopped short: a parse error, an uncaught one, the time limit */
function crash_text_from_php(result)
{
    const text = [result.stderr, (result.stdout || '').split('\n').filter(v => !v.startsWith(PHP_CASE_MARK)).join('\n')].join('\n').trim();
    return text || null;
}

function php_run(code, files)
{
    return new Promise(function (resolve) {
        if (!php_runner) {
            php_runner_start();
        }
        const job = {id: ++php_job_seq, code, files};
        php_runner.pending = {job, resolve};
        php_runner.limit_timer = setTimeout(function () {
            php_runner_stop();
            resolve({stdout: '', stderr: `Time limit exceeded: PHP did not finish in ${PHP_RUN_LIMIT_MS/1000} s. An endless loop?`});
        }, PHP_RUN_LIMIT_MS);
        if (php_runner.is_ready) {
            php_job_send();
        }
    });
}

function php_job_send()
{
    php_runner.frame.contentWindow.postMessage({__sbphp: 1, job: php_runner.pending.job}, '*');
}

function message_php(event)
{
    const data = event.data;
    if (!php_runner || !data || (data.__sbphp !== 1) || (event.source !== php_runner.frame.contentWindow)) {
        return;
    }
    if (data.ready) {
        php_runner.is_ready = true;
        if (php_runner.pending) {
            php_job_send();
        }
        return;
    }
    const pending = php_runner.pending;
    if (!pending) {
        return;
    }
    if (data.failed) {
        php_runner_stop();
        pending.resolve({stdout: '', stderr: data.failed});
        return;
    }
    if (!data.result || data.result.started || (data.result.id !== pending.job.id)) {
        return;
    }
    clearTimeout(php_runner.limit_timer);
    php_runner.pending = null;
    pending.resolve(data.result);
}

function php_runner_start()
{
    const worker_src = `(${php_worker_main.toString()})(${JSON.stringify(PHP_WASM_URL)}, ${JSON.stringify(PHP_WASM_LIBS)});`;
    const frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-scripts');
    frame.setAttribute('title', 'PHP runner');
    frame.style.display = 'none';
    frame.srcdoc = `<!doctype html><meta charset="utf-8"><${'script'}>(${php_runner_main.toString()})(${JSON.stringify(worker_src)});</${'script'}>`;
    document.body.appendChild(frame);
    php_runner = {frame, is_ready: false, pending: null, limit_timer: 0};
    window.addEventListener('message', message_php);
}

/* an endless loop never answers: the iframe goes, and its worker with it; the next run loads php-wasm again */
function php_runner_stop()
{
    if (!php_runner) {
        return;
    }
    clearTimeout(php_runner.limit_timer);
    php_runner.frame.remove();
    window.removeEventListener('message', message_php);
    php_runner = null;
}

/* the worker: loads php-wasm once, runs each job in a fresh PHP with the snippets written under /snippets.
   The same function as in the sandbox's index.html, kept word for word. */
function php_worker_main(php_wasm_url, shared_libs) {
    self.window = self;
    self.document = {};
    /* php-wasm waits on navigator.locks, which an opaque origin refuses; without it, it locks in memory */
    Object.defineProperty(WorkerNavigator.prototype, 'locks', {get: () => undefined, configurable: true});
    const out = [];
    const err = [];
    let php = null;
    let used = false;
    let chain = import(php_wasm_url).then(function (module) {
        php = new module.PhpWeb({version: '8.4', sharedLibs: shared_libs});
        php.addEventListener('output', function (event) {
            out.push(event.detail.join(''));
        });
        php.addEventListener('error', function (event) {
            err.push(event.detail.join(''));
        });
        return php.binary;
    });
    async function job_run(job) {
        if (used) {
            /* the files outlive refresh(): last run's snippets go, so a deleted one is not found;
               and refresh() loads the extensions again from the working directory: no chdir() outlives a run */
            await php.run('<?php chdir("/"); $rm = function ($d) use (&$rm) { foreach (array_diff(scandir($d), [".", ".."]) as $n) { is_dir("$d/$n") ? $rm("$d/$n") : unlink("$d/$n"); } rmdir($d); }; if (is_dir("/snippets")) { $rm("/snippets"); }');
            await php.refresh();
        }
        used = true;
        out.length = 0;
        err.length = 0;
        for (const file of job.files) {
            let dir = '';
            for (const part of file.path.split('/').slice(0, -1)) {
                dir = `${dir}/${part}`;
                const info = await php.analyzePath(dir);
                if (!info.exists) {
                    await php.mkdir(dir);
                }
            }
            await php.writeFile(`/${file.path}`, file.content);
        }
        self.postMessage({id: job.id, started: true});
        const ret = await php.run(job.code);
        return {id: job.id, ret, stdout: out.join(''), stderr: err.join('')};
    }
    self.onmessage = function (event) {
        const job = event.data;
        chain = chain.then(() => job_run(job)).then(function (result) {
            self.postMessage(result);
        }).catch(function (error) {
            self.postMessage({id: job.id, ret: -1, stdout: out.join(''), stderr: String((error && error.message) || error)});
        });
    };
}

/* the hidden iframe: owns the worker and passes jobs and results between it and the page */
function php_runner_main(worker_src) {
    const worker = new Worker(URL.createObjectURL(new Blob([worker_src], {type: 'text/javascript'})));
    worker.onmessage = function (event) {
        parent.postMessage({__sbphp: 1, result: event.data}, '*');
    };
    worker.onerror = function (event) {
        parent.postMessage({__sbphp: 1, failed: String(event.message || 'the PHP worker failed')}, '*');
    };
    window.addEventListener('message', function (event) {
        if (event.data && (event.data.__sbphp === 1)) {
            worker.postMessage(event.data.job);
        }
    });
    parent.postMessage({__sbphp: 1, ready: true}, '*');
}

/* PHP gives an empty array where JavaScript has an empty object; numbers are equal within a hair */
function is_value_equal(a, b)
{
    if (a === b) {
        return true;
    }
    if ((typeof a === 'number') && (typeof b === 'number')) {
        return Math.abs(a - b) <= 1e-9;
    }
    if (!is_object(a) || !is_object(b)) {
        return false;
    }
    const keys_a = Object.keys(a);
    const keys_b = Object.keys(b);
    if ((keys_a.length === 0) && (keys_b.length === 0)) {
        return true;
    }
    if ((Array.isArray(a) !== Array.isArray(b)) || (keys_a.length !== keys_b.length)) {
        return false;
    }
    return keys_a.every(v => Object.hasOwn(b, v) && is_value_equal(a[v], b[v]));
}

function is_object(value)
{
    return (value !== null) && (typeof value === 'object');
}

/* ---------- the sandbox's workspace "Practice": a folder per group, a file per topic and language ---------- */

function sandbox_practice_write(topic, lang, code)
{
    try {
        const workspaces = sandbox_workspaces_read();
        if (!workspaces.list.some(v => v.id === SANDBOX_PRACTICE_ID)) {
            workspaces.list.push({id: SANDBOX_PRACTICE_ID, name: 'Practice'});
            localStorage.setItem(SANDBOX_WORKSPACES_KEY, JSON.stringify(workspaces));
        }
        const workspace = JSON.parse(localStorage.getItem(SANDBOX_PRACTICE_KEY) || 'null') || sandbox_workspace_make();
        const folder_id = `practice_group_${topic.group.toLowerCase().replace(/[^a-z0-9]+/g, '_')}`;
        if (!workspace.folders.some(v => v.id === folder_id)) {
            workspace.folders.push({id: folder_id, name: topic.group, parentId: null, collapsed: false});
        }
        const file_id = `practice_${topic.uid}_${lang}`;
        const file = workspace.files.find(v => v.id === file_id);
        if (file) {
            file.content = code;
            file.folderId = workspace.folders.some(v => v.id === file.folderId) ? file.folderId : folder_id;
        }
        else {
            workspace.files.push({id: file_id, name: `${topic.uid}.${lang}`, folderId: folder_id, content: code});
        }
        workspace.activeId = file_id;
        localStorage.setItem(SANDBOX_PRACTICE_KEY, JSON.stringify(workspace));
    }
    catch (error) {
        console.warn(error);
    }
}

/* the list of the sandbox's workspaces, or the one it starts with when it has none yet */
function sandbox_workspaces_read()
{
    try {
        const out = JSON.parse(localStorage.getItem(SANDBOX_WORKSPACES_KEY));
        if (out && Array.isArray(out.list) && out.list.length) {
            return out;
        }
    }
    catch {
    }
    return {active: 'main', list: [{id: 'main', name: 'Sandbox'}]};
}

function sandbox_workspace_make()
{
    return {files: [], folders: [], trash: [], search: '', activeId: null, title: 'Practice', theme: document.documentElement.dataset.theme, viewState: {}, templates: {}};
}

/* ---------- storage, save all, load ---------- */

function storage_read()
{
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (is_object(saved)) {
            state_assign(saved);
        }
    }
    catch (error) {
        console.warn(error);
    }
}

function state_assign(saved)
{
    editor_topic_uid = null;
    state.drafts = is_object(saved.drafts) ? saved.drafts : {};
    state.solved = is_object(saved.solved) ? saved.solved : {};
    state.history = Array.isArray(saved.history) ? saved.history.filter(is_run_valid) : [];
    if (typeof saved.topic_uid === 'string') {
        state.topic_uid = saved.topic_uid;
    }
    if ((saved.lang === 'js') || (saved.lang === 'php')) {
        state.lang = saved.lang;
        state.lang_wanted = saved.lang;
    }
}

function is_run_valid(run)
{
    return is_object(run)
        && (typeof run.time === 'string')
        && !!topic_by_uid[run.topic_uid]
        && !!LANG_NAMES[run.lang]
        && Number.isInteger(run.passed)
        && Number.isInteger(run.total)
        && (typeof run.code === 'string');
}

function saved_from_state()
{
    return {topic_uid: state.topic_uid, lang: state.lang_wanted, drafts: state.drafts, solved: state.solved, history: state.history};
}

function storage_write()
{
    clearTimeout(storage_timer);
    storage_timer = 0;
    draft_flush_quiet();
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saved_from_state()));
        state.is_storage_failing = false;
    }
    catch (error) {
        state.is_storage_failing = true;
        toast_show('Not saved: the browser refused to keep it. Save all to a file to keep your work.');
    }
}

function storage_write_soon()
{
    clearTimeout(storage_timer);
    storage_timer = setTimeout(storage_write, 400);
}

function draft_flush_quiet()
{
    if (draft_timer) {
        clearTimeout(draft_timer);
        draft_timer = 0;
        const timer = storage_timer;
        draft_flush();
        clearTimeout(storage_timer);
        storage_timer = timer;
    }
}

function click_save()
{
    draft_flush();
    const saved = Object.assign({format: SAVE_FORMAT, saved_at: new Date().toISOString()}, saved_from_state());
    const blob = new Blob([JSON.stringify(saved, null, 1)], {type: 'application/json'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `practice-${format_file_time(new Date())}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    toast_show(`Saved: ${format_count(Object.keys(state.solved).length, 'topic solved', 'topics solved')}, ${format_count(state.history.length, 'submission', 'submissions')}.`);
}

function change_load_input(event)
{
    const file = event.target.files[0];
    event.target.value = '';
    if (file) {
        file_load(file);
    }
}

/* a loaded file takes the place of everything here; Undo brings back what was here before */
async function file_load(file)
{
    let saved = null;
    try {
        saved = JSON.parse(await file.text());
    }
    catch {
        toast_show(`${file.name} is not a file saved by Save all: it does not read as JSON.`);
        return;
    }
    if (!is_object(saved) || (saved.format !== SAVE_FORMAT)) {
        toast_show(`${file.name} is not a file saved by Save all.`);
        return;
    }
    draft_flush();
    const before = JSON.parse(JSON.stringify(saved_from_state()));
    state_assign(saved);
    state_apply();
    toast_show(`Loaded ${file.name}: ${format_count(Object.keys(state.solved).length, 'topic solved', 'topics solved')}, ${format_count(state.history.length, 'submission', 'submissions')}.`, function () {
        state_assign(before);
        state_apply();
        toast_show('Back as it was before the load.');
    });
}

function state_apply()
{
    if (!topic_by_uid[state.topic_uid]) {
        state.topic_uid = PRACTICE_TOPICS[0].uid;
    }
    storage_write();
    topic_open(state.topic_uid);
    refresh_progress();
    refresh_history();
}

function dragenter_document(event)
{
    if (!is_file_drag(event)) {
        return;
    }
    drag_depth += 1;
    document.getElementById('drop-veil').hidden = false;
}

function dragleave_document(event)
{
    if (!is_file_drag(event)) {
        return;
    }
    drag_depth = Math.max(0, drag_depth - 1);
    document.getElementById('drop-veil').hidden = (drag_depth === 0);
}

function dragover_document(event)
{
    if (is_file_drag(event)) {
        event.preventDefault();
    }
}

function drop_document(event)
{
    if (!is_file_drag(event)) {
        return;
    }
    event.preventDefault();
    drag_depth = 0;
    document.getElementById('drop-veil').hidden = true;
    const file = event.dataTransfer.files[0];
    if (file) {
        file_load(file);
    }
}

function is_file_drag(event)
{
    return Array.from(event.dataTransfer ? event.dataTransfer.types : []).includes('Files');
}

/* ---------- tabs, theme, keys, toast ---------- */

/* "topics" is the page of every topic, "topic" the open one, "history" every Submit */
function tab_open(tab)
{
    state.tab = tab;
    route_write();
    refresh_tab();
}

/* ---------- the bar between the code and the rest: dragged, or moved by the arrow keys; each viewer keeps their own ---------- */

function split_read()
{
    try {
        const value = Number(localStorage.getItem(SPLIT_KEY));
        if ((value > 0) && (value < 1)) {
            state.split = value;
        }
    }
    catch {
    }
}

function split_set(value)
{
    state.split = split_clamp(value);
    refresh_split();
    try {
        localStorage.setItem(SPLIT_KEY, String(state.split));
    }
    catch {
    }
}

/* neither side narrower than SPLIT_PANE_MIN_PX while the split has room for both */
function split_clamp(value)
{
    const width = document.getElementById('split').clientWidth - SPLIT_BAR_PX;
    const min = (width > 2*SPLIT_PANE_MIN_PX) ? SPLIT_PANE_MIN_PX/width : 0.5;
    return Math.min(1 - min, Math.max(min, value));
}

function pointerdown_split(event)
{
    if (event.button !== 0) {
        return;
    }
    event.preventDefault();
    const bar = event.currentTarget;
    const rect = document.getElementById('split').getBoundingClientRect();
    bar.setPointerCapture(event.pointerId);
    bar.classList.add('is-held');
    document.body.classList.add('is-splitting');
    bar.addEventListener('pointermove', pointermove_bar);
    bar.addEventListener('pointerup', pointerup_bar);
    bar.addEventListener('pointercancel', pointerup_bar);
    function pointermove_bar(move) {
        state.split = split_clamp((move.clientX - rect.left - SPLIT_BAR_PX/2)/(rect.width - SPLIT_BAR_PX));
        refresh_split();
    }
    function pointerup_bar() {
        bar.removeEventListener('pointermove', pointermove_bar);
        bar.removeEventListener('pointerup', pointerup_bar);
        bar.removeEventListener('pointercancel', pointerup_bar);
        bar.classList.remove('is-held');
        document.body.classList.remove('is-splitting');
        split_set(state.split);
    }
}

function keydown_split(event)
{
    const step_by_key = {ArrowLeft: -0.02, ArrowRight: 0.02};
    if (!(event.key in step_by_key)) {
        return;
    }
    event.preventDefault();
    split_set(state.split + step_by_key[event.key]);
}

/* ---------- the address: #<topic uid>, #history, or none for the topics; a reload keeps it, Back goes to the one before ---------- */

function route_name_read()
{
    try {
        return decodeURIComponent(location.hash.slice(1));
    }
    catch {
        return '';
    }
}

function route_from_state()
{
    if (state.tab === 'topic') {
        return `#${encodeURIComponent(state.topic_uid)}`;
    }
    if (state.tab === 'history') {
        return '#history';
    }
    return '';
}

/* a file:// page may refuse pushState; the hash itself still moves there */
function route_write()
{
    const route = route_from_state();
    if (location.hash === route) {
        return;
    }
    try {
        window.history.pushState(null, '', route || `${location.pathname}${location.search}`);
    }
    catch {
        location.hash = route;
    }
}

function route_apply()
{
    const name = route_name_read();
    if (name === 'history') {
        state.tab = 'history';
        return;
    }
    if (topic_by_uid[name]) {
        if (name !== state.topic_uid) {
            topic_open(name);
        }
        state.tab = 'topic';
        return;
    }
    state.tab = 'topics';
}

function popstate_window()
{
    route_apply();
    refresh_tab();
}

function click_theme()
{
    const theme = (document.documentElement.dataset.theme === 'dark') ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    try {
        localStorage.setItem(THEME_KEY, theme);
    }
    catch {
    }
    refresh_theme_button();
}

/* the theme picked meanwhile in the sandbox or another tab: THEME_KEY changed, or this page came back from the history */
function theme_sync()
{
    let theme = null;
    try {
        theme = localStorage.getItem(THEME_KEY);
    }
    catch {
    }
    if (((theme === 'light') || (theme === 'dark')) && (theme !== document.documentElement.dataset.theme)) {
        document.documentElement.dataset.theme = theme;
        refresh_theme_button();
    }
}

/* on the topics, typing outside a field goes to their search, the first character too */
function keydown_document(event)
{
    if ((event.ctrlKey || event.metaKey) && (event.key === 'Enter')) {
        event.preventDefault();
        if (state.tab === 'topic') {
            tests_run(event.shiftKey ? 'submit' : 'run');
        }
        return;
    }
    if ((state.tab !== 'topics') || event.ctrlKey || event.metaKey || event.altKey || (event.key.length !== 1)) {
        return;
    }
    const target = event.target;
    if (target.closest('input, textarea, select, [contenteditable], .CodeMirror')) {
        return;
    }
    document.getElementById('search').focus();
}

function toast_show(text, undo)
{
    clearTimeout(toast_timer);
    toast_undo = undo || null;
    document.getElementById('toast-text').textContent = text;
    document.getElementById('toast-undo').hidden = !undo;
    document.getElementById('toast').hidden = false;
    toast_timer = setTimeout(toast_hide, undo ? 9000 : 4500);
}

function toast_hide()
{
    document.getElementById('toast').hidden = true;
    toast_undo = null;
}

function click_toast_undo()
{
    const undo = toast_undo;
    toast_hide();
    if (undo) {
        undo();
    }
}

/* ---------- the history ---------- */

function click_history(event)
{
    const action = event.target.closest('[data-action]');
    if (action) {
        history_act(action.dataset.action, action.dataset.time);
        return;
    }
    const row = event.target.closest('[data-run]');
    if (!row) {
        return;
    }
    history_open_time = (history_open_time === row.dataset.run) ? null : row.dataset.run;
    refresh_history();
}

function history_act(action, time)
{
    const run = state.history.find(v => v.time === time);
    if (!run) {
        return;
    }
    if (action === 'open') {
        topic_open(run.topic_uid);
        tab_open('topic');
        return;
    }
    if (action === 'use') {
        draft_flush();
        editor_topic_uid = null;
        state.drafts[run.topic_uid] = Object.assign({}, state.drafts[run.topic_uid], {[run.lang]: run.code});
        state.lang_wanted = run.lang;
        storage_write();
        topic_open(run.topic_uid);
        tab_open('topic');
        toast_show(`The code of ${format_time(run.time)} is in the editor now.`);
    }
}

/* ---------- refresh: each brings a part of the page up to date ---------- */

function refresh_tab()
{
    document.getElementById('tab-topics').classList.toggle('is-on', state.tab !== 'history');
    document.getElementById('tab-history').classList.toggle('is-on', state.tab === 'history');
    document.getElementById('catalog-view').hidden = (state.tab !== 'topics');
    document.getElementById('topic-view').hidden = (state.tab !== 'topic');
    document.getElementById('history-view').hidden = (state.tab !== 'history');
    if (state.tab === 'history') {
        refresh_history();
    }
    if (state.tab === 'topics') {
        refresh_topic_list();
    }
    if (state.tab === 'topic') {
        editor.refresh();
    }
    refresh_progress();
}

function refresh_pane()
{
    document.getElementById('pane-tab-task').classList.toggle('is-on', state.pane === 'task');
    document.getElementById('pane-tab-tests').classList.toggle('is-on', state.pane === 'tests');
    document.getElementById('pane-tab-explanation').classList.toggle('is-on', state.pane === 'explanation');
    document.getElementById('pane-task').hidden = (state.pane !== 'task');
    document.getElementById('pane-tests').hidden = (state.pane !== 'tests');
    document.getElementById('pane-explanation').hidden = (state.pane !== 'explanation');
}

function refresh_split()
{
    const split = document.getElementById('split');
    split.style.setProperty('--split-left', `${(100*state.split).toFixed(2)}fr`);
    split.style.setProperty('--split-right', `${(100*(1 - state.split)).toFixed(2)}fr`);
    document.getElementById('split-bar').setAttribute('aria-valuenow', String(Math.round(100*state.split)));
    editor.refresh();
}

function refresh_theme_button()
{
    const is_dark = (document.documentElement.dataset.theme === 'dark');
    const sun = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const moon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
    const button = document.getElementById('theme-btn');
    button.innerHTML = is_dark ? moon : sun;
    button.title = is_dark ? 'Dark theme: switch to light' : 'Light theme: switch to dark';
}

function refresh_progress()
{
    const solved = PRACTICE_TOPICS.filter(v => langs_solved_of(v.uid).length).length;
    document.getElementById('progress-text').textContent = `${solved} of ${PRACTICE_TOPICS.length} solved`;
    document.getElementById('progress-fill').style.width = `${(100*solved/PRACTICE_TOPICS.length).toFixed(1)}%`;
}

/* every group a card of its topics, in its own colour; a search keeps the topics it matches, the first one marked for Enter */
function refresh_topic_list()
{
    const topics = topics_match(state.search);
    const first_uid = (state.search.trim() && topics.length) ? topics[0].uid : null;
    const html = [];
    for (const group of PRACTICE_GROUPS) {
        const members = PRACTICE_TOPICS.filter(v => v.group === group);
        const shown = topics.filter(v => v.group === group);
        if (!shown.length) {
            continue;
        }
        const solved = members.filter(v => langs_solved_of(v.uid).length).length;
        html.push([
            `<section class="group-card group-tinted" style="--hue: ${hue_of_group(group)}">`,
            `<div class="group-head"><span class="group-title">${esc(group)}</span><span class="group-count">${solved} of ${members.length} solved</span></div>`,
            `<div class="group-bar"><div class="group-fill" style="width: ${(100*solved/members.length).toFixed(1)}%"></div></div>`,
            shown.map(v => render_topic_link(v, v.uid === first_uid)).join(''),
            '</section>',
        ].join(''));
    }
    if (!html.length) {
        html.push(`<p class="list-empty">No topic matches “${esc(state.search)}”.</p>`);
    }
    document.getElementById('topic-list').innerHTML = html.join('');
    refresh_catalog_next();
    refresh_progress();
}

function render_topic_link(topic, is_first)
{
    const langs = langs_solved_of(topic.uid);
    const is_here = langs.includes(state.lang);
    const mark_class = is_here ? 'is-solved' : (langs.length ? 'is-other' : '');
    const mark_title = langs.length ? `Solved in ${langs.map(v => LANG_NAMES[v]).join(' and ')}` : 'Not solved yet';
    const dots = [1, 2, 3].map(v => `<i class="${(v <= topic.level) ? 'is-on' : ''}"></i>`).join('');
    const on = (topic.uid === state.topic_uid) ? ' is-on' : '';
    const first = is_first ? ' is-first' : '';
    return `<button class="topic-link${on}${first}" data-topic="${esc(topic.uid)}"><span class="topic-mark ${mark_class}" title="${mark_title}">${langs.length ? '✓' : ''}</span><span class="topic-name">${esc(topic.title)}</span><span class="level is-${topic.level}" title="${LEVEL_NAMES[topic.level]}">${dots}</span></button>`;
}

/* the topic last opened, to carry on with; a first visit starts with the first topic */
function refresh_catalog_next()
{
    const topic = topic_find_active();
    const is_started = is_topic_started(topic.uid);
    document.getElementById('catalog-next').innerHTML = [
        `<button class="next-card group-tinted" style="--hue: ${hue_of_group(topic.group)}" data-topic="${esc(topic.uid)}">`,
        `<span class="next-label">${is_started ? 'Continue' : 'Start with'}</span>`,
        `<span class="next-title">${esc(topic.title)}</span>`,
        `<span class="next-note">${esc(topic.group)} · ${LEVEL_NAMES[topic.level]}</span>`,
        '</button>',
    ].join('');
}

function refresh_catalog_note()
{
    document.getElementById('catalog-note').textContent = `${PRACTICE_TOPICS.length} topics in ${PRACTICE_GROUPS.length} groups, each a function to write in JavaScript or PHP. Run tries it on the examples; Submit checks it on every test.`;
}

/* the groups' hues a golden angle apart, so neighbours never look alike */
function hue_of_group(group)
{
    return Math.round((170 + 137.5*PRACTICE_GROUPS.indexOf(group)) % 360);
}

function refresh_topic()
{
    const topic = topic_find_active();
    const solved_langs = langs_solved_of(topic.uid);
    const tags = [
        `<span class="tag tag-group group-tinted" style="--hue: ${hue_of_group(topic.group)}">${esc(topic.group)}</span>`,
        `<span class="tag tag-level is-${topic.level}">${LEVEL_NAMES[topic.level]}</span>`,
    ];
    if (topic.from.length) {
        tags.push(`<span class="tag">from ${esc(topic.from.join(' and '))}</span>`);
    }
    if (solved_langs.length) {
        tags.push(`<span class="tag tag-ok">✓ solved in ${solved_langs.map(v => LANG_NAMES[v]).join(' and ')}</span>`);
    }
    document.getElementById('topic-crumbs').innerHTML = tags.join('');
    document.getElementById('topic-title').textContent = topic.title;
    document.getElementById('topic-brief').innerHTML = render_text(topic.brief);
    const rules = topic.rules.filter(Boolean).map(v => `<li>${render_text(v)}</li>`).join('');
    document.getElementById('topic-task').innerHTML = [
        `<div class="mono">${esc(signature_of(topic, state.lang))}</div>`,
        rules ? `<ul class="rules" style="margin-top:10px">${rules}</ul>` : '',
        `<p style="margin-top:10px"><span class="example-label">Input</span>${render_text(topic.input.text)}</p>`,
        `<div class="mono">${esc(format_input_example(topic.input.example))}</div>`,
    ].join('');
    const drawn = Object.values(topic.input.example).find(v => is_tree_root(v) || (Array.isArray(v) && v.length && v.every(is_tree_root)));
    document.getElementById('task-side').hidden = !drawn;
    document.getElementById('task-diagram').innerHTML = drawn ? render_diagram(drawn, null) : '';
    refresh_explanation();
    refresh_hints();
    refresh_solution();
    refresh_lang();
}

/* the approach in paragraphs, the example traced; the cost, the usual mistakes and the sources where a topic has them */
function refresh_explanation()
{
    const topic = topic_find_active();
    const explanation = topic.explanation;
    const html = explanation.approach.split(/\n\n+/).map(v => `<p>${render_text(v)}</p>`);
    html.push(`<div class="example"><span class="example-label">On the example</span>${render_text(explanation.example)}</div>`);
    if (explanation.cost) {
        html.push(`<div class="explain-part"><span class="example-label">Cost</span>${render_text(explanation.cost)}</div>`);
    }
    if (explanation.pitfalls) {
        html.push(`<div class="explain-part"><span class="example-label">Mistakes to avoid</span><ul class="rules">${explanation.pitfalls.map(v => `<li>${render_text(v)}</li>`).join('')}</ul></div>`);
    }
    document.getElementById('topic-explanation').innerHTML = html.join('');
    const sources = topic.sources || [];
    const links = sources.map(v => `<li><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a></li>`);
    document.getElementById('topic-sources').innerHTML = `<ul class="sources">${links.join('')}</ul>`;
    document.getElementById('topic-sources-card').hidden = !sources.length;
}

function refresh_hints()
{
    const topic = topic_find_active();
    const hints = topic.hints.filter(Boolean);
    const shown = hints.slice(0, state.hints_shown).map(v => `<p class="hint">${render_text(v)}</p>`).join('');
    const rest = hints.length - state.hints_shown;
    const more = (rest > 0) ? `<button class="link-btn" data-hint-more="1">${state.hints_shown ? 'One more hint' : 'Show a hint'} (${state.hints_shown + 1} of ${hints.length})</button>` : '';
    document.getElementById('topic-hints').innerHTML = (shown || more) ? `${shown}${more}` : '<p>This topic has no hints.</p>';
}

function refresh_solution()
{
    const topic = topic_find_active();
    const code = (state.lang === 'php') ? topic.solution_php : topic.solution;
    const lang_name = LANG_NAMES[state.lang];
    const box = document.getElementById('topic-solution');
    if (!state.is_solution_shown) {
        box.innerHTML = `<p>One way to write it, in ${lang_name}: try first, look after.</p><button class="link-btn" data-solution-toggle="1">Show the example in ${lang_name}</button>`;
        return;
    }
    box.innerHTML = `<div class="mono" id="solution-code"></div><p style="margin-top:8px"><button class="link-btn" data-solution-toggle="1">Hide it</button></p>`;
    CodeMirror.runMode(code, (state.lang === 'php') ? 'application/x-httpd-php' : 'javascript', document.getElementById('solution-code'));
}

function refresh_lang()
{
    const topic = topic_find_active();
    const php_button = document.getElementById('lang-php');
    document.getElementById('lang-js').classList.toggle('is-on', state.lang === 'js');
    php_button.classList.toggle('is-on', state.lang === 'php');
    php_button.disabled = !topic.solution_php;
    php_button.title = topic.solution_php ? 'Solve it in PHP: it runs in the browser, as in the sandbox' : `JavaScript only: ${topic.php_note || 'this topic has no PHP version yet'}`;
    const solved_at = (state.solved[topic.uid] || {})[state.lang];
    const draft = (state.drafts[topic.uid] || {})[state.lang];
    const notes = [];
    if (!topic.solution_php) {
        notes.push(`JavaScript only: ${topic.php_note || 'no PHP version yet'}`);
    }
    if (solved_at) {
        notes.push(`solved ${format_time(solved_at)}`);
    }
    notes.push(draft ? 'draft kept' : 'starter code');
    if (state.is_storage_failing) {
        notes.push('not saved');
    }
    document.getElementById('lang-note').textContent = notes.join(' · ');
}

function refresh_run_summary()
{
    const summary = document.getElementById('run-summary');
    const is_running = (state.run_status === 'running');
    const is_submit = (state.run_mode === 'submit');
    const passed = state.run_indexes.filter(v => state.cases[v].status === 'pass').length;
    const total = state.run_indexes.length;
    document.getElementById('run-btn').disabled = is_running;
    document.getElementById('submit-btn').disabled = is_running;
    summary.className = 'run-summary';
    switch (state.run_status) {
    case 'running':
        summary.textContent = `${is_submit ? 'Running every test' : 'Running'}${(state.lang === 'php') ? ' in PHP… the first run loads PHP, a few seconds' : '…'}`;
        break;
    case 'pass':
        summary.classList.add('is-pass');
        summary.textContent = is_submit ? `All ${total} passed. Solved.` : `${format_count(total, 'test', 'tests')} passed. Submit when it is ready.`;
        break;
    case 'fail':
        summary.classList.add('is-fail');
        summary.textContent = `${passed} of ${total} passed`;
        break;
    default:
        summary.textContent = `${format_count(state.cases.length, 'test', 'tests')} to pass`;
    }
    refresh_lang();
}

/* the examples first, then the other tests, each a numbered chip in the colour of its result */
function refresh_cases()
{
    const html = [];
    for (const [index, item] of state.cases.entries()) {
        if (index === 0) {
            html.push('<span class="chips-label">Examples</span>');
        }
        if (index === EXAMPLES_COUNT) {
            html.push('<span class="chips-label">Tests</span>');
        }
        html.push(render_case_chip(item, index));
    }
    document.getElementById('case-chips').innerHTML = html.join('');
    refresh_case_detail();
}

function refresh_case_chip(index)
{
    const chip = document.querySelector(`.case-chip[data-case="${index}"]`);
    if (chip) {
        chip.outerHTML = render_case_chip(state.cases[index], index);
    }
}

function render_case_chip(item, index)
{
    const on = (index === state.case_index) ? ' is-on' : '';
    return `<button class="case-chip is-${item.status}${on}" data-case="${index}" title="${esc(format_case_name(index))}: ${esc(item.item.label)}">${index + 1}</button>`;
}

function format_case_name(index)
{
    return (index < EXAMPLES_COUNT) ? `Example ${index + 1}` : `Test ${index + 1}`;
}

function click_case_chips(event)
{
    const chip = event.target.closest('[data-case]');
    if (!chip) {
        return;
    }
    state.case_index = Number(chip.dataset.case);
    for (const node of document.querySelectorAll('.case-chip')) {
        node.classList.toggle('is-on', node === chip);
    }
    refresh_case_detail();
}

function refresh_case_detail()
{
    const box = document.getElementById('case-detail');
    const item = state.cases[state.case_index];
    if (!item) {
        box.innerHTML = '';
        return;
    }
    const html = [`<p class="detail-title">${esc(format_case_name(state.case_index))} · ${esc(item.item.label)}</p>`];
    if (item.item.note) {
        html.push(`<p class="detail-note">${render_text(item.item.note)}</p>`);
    }
    if (item.message) {
        html.push(`<div class="message">${esc(item.message)}</div>`);
    }
    const actual_class = (item.status === 'pass') ? 'is-pass' : (((item.status === 'fail') || (item.status === 'error')) ? 'is-fail' : '');
    const expected_html = (item.expected === undefined) ? '<div class="mono">working it out…</div>' : render_value_box(item.expected, '');
    const actual_html = (item.actual === undefined) ? `<div class="mono ${actual_class}">${esc(format_missing_actual(item))}</div>` : render_value_box(item.actual, actual_class);
    const is_stacked = [item.expected, item.actual].some(v => is_object(v) && format_value(v).includes('\n'));
    html.push(`<div class="pair${is_stacked ? ' is-stacked' : ''}"><div><span class="pair-label">Expected</span>${expected_html}</div><div><span class="pair-label">Your result</span>${actual_html}</div></div>`);
    if (item.logs.length) {
        html.push(`<div class="logs"><span class="pair-label">Printed</span><div class="mono">${esc(item.logs.join('\n'))}</div></div>`);
    }
    html.push(`<div class="detail-input">${render_case_diagram(item)}${render_case_args(item)}</div>`);
    box.innerHTML = html.join('');
}

/* a tree is drawn, the value itself one click away; an edit draws the tree after the call under what was returned */
function render_value_box(value, status_class)
{
    const text = `<div class="mono ${status_class}">${esc(format_value(value))}</div>`;
    if (is_tree_value(value)) {
        return `${render_diagram(value, null)}<details><summary>As a value</summary>${text}</details>`;
    }
    if (is_object(value) && ('returned' in value) && is_tree_value(value.tree) && (topic_find_active().observe === 'edit')) {
        return `<div class="mono ${status_class}">returned ${esc(format_value(value.returned))}</div>${render_diagram(value.tree, null)}<details><summary>As a value</summary>${text}</details>`;
    }
    return text;
}

function is_tree_value(value)
{
    return is_tree_root(value) || (Array.isArray(value) && (value.length > 0) && value.every(is_tree_root));
}

function format_missing_actual(item)
{
    switch (item.status) {
    case 'running':
        return 'running…';
    case 'skipped':
        return 'not run: the run stopped before this case';
    case 'error':
    case 'timeout':
        return 'no result';
    default:
        return 'Run to see what your function returns.';
    }
}

function render_case_args(item)
{
    const kind = item.item.kind || 'plain';
    if (kind !== 'plain') {
        return '';
    }
    const topic = topic_find_active();
    const drawn_index = item.item.args.findIndex(is_tree_value);
    const drawn_name = Array.isArray(item.item.args[drawn_index]) ? 'the trees drawn above' : 'the tree drawn above';
    const lines = topic.params.map((v, i) => `${v} = ${(i === drawn_index) ? drawn_name : format_arg(item.item.args[i])}`);
    const drawn = (drawn_index >= 0) ? `<details><summary>As a value</summary><div class="mono">${esc(format_arg(item.item.args[drawn_index]))}</div></details>` : '';
    return `<span class="pair-label">Called with</span><div class="mono" style="margin-bottom:4px">${esc(lines.join('\n'))}</div>${drawn}<div style="height:10px"></div>`;
}

function render_case_diagram(item)
{
    const kind = item.item.kind || 'plain';
    if (kind === 'lazy') {
        return '';
    }
    if ((kind === 'probe') || (kind === 'steps')) {
        return render_diagram(item.item.tree, item.item.start);
    }
    for (const arg of item.item.args) {
        if (is_object(arg) && (arg.$make === 'chain')) {
            return `<div class="diagram"><div class="diagram-note">A chain ${arg.size.toLocaleString('en-US')} nodes deep: n0 → n1 → … → n${(arg.size - 1).toLocaleString('en-US')}, too long to draw.</div></div>`;
        }
        if (is_tree_root(arg) || (Array.isArray(arg) && arg.length && arg.every(is_tree_root))) {
            return render_diagram(arg, null);
        }
    }
    return '';
}

/* ---------- the tree diagram: leaves take x 0, 1, 2…; a parent sits halfway between its first and last child ---------- */

function render_diagram(root, highlight_uid)
{
    let leaves = 0;

    const roots = Array.isArray(root) ? root : [root];
    const nodes = [];
    for (const item of roots) {
        node_place(item, 0, null);
    }
    if (nodes.length > DIAGRAM_NODES_LIMIT) {
        return `<div class="diagram"><div class="diagram-note">${nodes.length} nodes: too many to draw; the args below hold them all.</div></div>`;
    }
    const width_by_node = nodes.map(v => Math.max(30, 8*v.label.length + 16));
    const step_x = Math.min(120, Math.max(44, Math.max(...width_by_node) + 12));
    const step_y = 58;
    const pad = 22;
    const depth_max = Math.max(...nodes.map(v => v.depth));
    const width = Math.max(1, leaves)*step_x + 2*pad;
    const height = (depth_max + 1)*step_y + 2*pad - 20;
    const edges = [];
    const shapes = [];
    nodes.forEach(function (node, i) {
        const x = pad + (node.x + 0.5)*step_x;
        const y = pad + 14 + node.depth*step_y;
        if (node.parent) {
            const px = pad + (node.parent.x + 0.5)*step_x;
            const py = pad + 14 + node.parent.depth*step_y;
            edges.push(`<line x1="${px}" y1="${py + 13}" x2="${x}" y2="${y - 13}" stroke="var(--edge)" stroke-width="1.5"${node.is_gap ? ' stroke-dasharray="3 3"' : ''}/>`);
        }
        if (node.is_gap) {
            shapes.push(`<circle cx="${x}" cy="${y}" r="3" fill="var(--edge)"/>`);
            return;
        }
        const w = width_by_node[i];
        const is_on = (highlight_uid !== null) && (node.uid === highlight_uid);
        const fill = is_on ? 'var(--accent)' : (node.color === 'red' ? 'var(--bad-soft)' : 'var(--node)');
        const stroke = is_on ? 'var(--accent)' : (node.color === 'red' ? 'var(--bad)' : (node.color === 'black' ? 'var(--ink)' : 'var(--line-strong)'));
        const ink = is_on ? 'var(--accent-ink)' : 'var(--ink)';
        shapes.push(`<rect x="${x - w/2}" y="${y - 13}" width="${w}" height="26" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/><text x="${x}" y="${y + 4.5}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="${ink}">${esc(node.label)}</text>`);
    });
    return `<div class="diagram"><svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${edges.join('')}${shapes.join('')}</svg></div>`;
    function node_place(node, depth, parent) {
        const placed = {label: label_of(node), uid: node.uid, color: node.color, depth, parent, x: 0, is_gap: false};
        nodes.push(placed);
        const children = children_of(node);
        if ((nodes.length > DIAGRAM_NODES_LIMIT) || !children.length) {
            placed.x = leaves++;
            return placed;
        }
        const placed_children = [];
        for (const child of children) {
            if (child === null) {
                const gap = {label: '', depth: depth + 1, parent: placed, x: leaves++, is_gap: true};
                nodes.push(gap);
                placed_children.push(gap);
                continue;
            }
            placed_children.push(node_place(child, depth + 1, placed));
        }
        placed.x = (placed_children[0].x + placed_children[placed_children.length - 1].x)/2;
        return placed;
    }
}

/* a binary node shows both branches when it has one: the empty side is a dot */
function children_of(node)
{
    if (Array.isArray(node.children)) {
        return node.children.filter(v => v !== null);
    }
    if (('left' in node) || ('right' in node)) {
        return (node.left || node.right) ? [node.left || null, node.right || null] : [];
    }
    return [];
}

function label_of(node)
{
    for (const key of ['uid', 'value', 'name', 'id']) {
        if (key in node) {
            return String(node[key]);
        }
    }
    if (Array.isArray(node.keys)) {
        return node.keys.join(' · ');
    }
    return '•';
}

function is_tree_root(value)
{
    return is_object(value) && !Array.isArray(value) && (Array.isArray(value.children) || ('left' in value) || ('right' in value) || ('type' in value));
}

/* ---------- format: text a person reads ---------- */

function format_value(value)
{
    if (value === undefined) {
        return 'undefined';
    }
    return format_value_lines(value, 0);
}

/* a value as a JavaScript literal: on one line when it fits, else one item or field a line */
function format_value_lines(value, indent)
{
    const one_line = format_value_inline(value);
    if (!is_object(value) || (one_line.length + indent <= 52)) {
        return one_line;
    }
    const pad = ' '.repeat(indent + 4);
    if (Array.isArray(value)) {
        const items = value.map(v => `${pad}${format_value_lines(v, indent + 4)}`);
        return `[\n${items.join(',\n')},\n${' '.repeat(indent)}]`;
    }
    const fields = Object.keys(value).map(v => `${pad}${format_key(v)}: ${format_value_lines(value[v], indent + 4)}`);
    return `{\n${fields.join(',\n')},\n${' '.repeat(indent)}}`;
}

function format_value_inline(value)
{
    if (typeof value === 'string') {
        return format_string(value);
    }
    if (!is_object(value)) {
        return String(value);
    }
    if (Array.isArray(value)) {
        return `[${value.map(format_value_inline).join(', ')}]`;
    }
    return `{${Object.keys(value).map(v => `${format_key(v)}: ${format_value_inline(value[v])}`).join(', ')}}`;
}

function format_key(key)
{
    return /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(key) ? key : format_string(key);
}

function format_string(text)
{
    return `'${text.replace(/\\/g, '\\\\').replace(/'/g, '\\\'').replace(/\n/g, '\\n')}'`;
}

function format_arg(arg)
{
    if (is_object(arg) && (typeof arg.$fn === 'string')) {
        return arg.$fn;
    }
    if (is_object(arg) && (arg.$make === 'chain')) {
        return `a chain ${arg.size.toLocaleString('en-US')} nodes deep`;
    }
    if (is_object(arg) && (arg.$make === 'numbers')) {
        return `${arg.size.toLocaleString('en-US')} whole numbers at random, from 0 to ${(arg.max - 1).toLocaleString('en-US')} (seed ${arg.seed})`;
    }
    if (is_object(arg) && (arg.$make === 'table') && (arg.version === 'after')) {
        return `the same table a while later: about 2% of its rows gone, 2% changed and 2% new (seed ${arg.seed})`;
    }
    if (is_object(arg) && (arg.$make === 'table')) {
        return `${arg.size.toLocaleString('en-US')} rows {id, name, price}, ids 1 to ${arg.size.toLocaleString('en-US')} in a random order (seed ${arg.seed})`;
    }
    return format_value_lines(arg, 0);
}

function format_input_example(example)
{
    return Object.keys(example).map(v => `${v} = ${(typeof example[v] === 'string') ? example[v] : format_value_lines(example[v], 0)}`).join('\n');
}

function format_time(iso)
{
    const date = new Date(iso);
    const now = new Date();
    const time = date.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
    if (date.toDateString() === now.toDateString()) {
        return `today ${time}`;
    }
    return `${date.toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: (date.getFullYear() === now.getFullYear()) ? undefined : 'numeric'})} ${time}`;
}

function format_file_time(date)
{
    const pad = v => String(v).padStart(2, '0');
    return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}-${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
}

function format_count(count, singular, plural)
{
    return (count === 1) ? `1 ${singular}` : `${count} ${plural}`;
}

/* inline `code` in a topic's texts; everything else is plain text */
function render_text(text)
{
    return esc(text || '').replace(/`([^`]+)`/g, '<code>$1</code>');
}

function esc(text)
{
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function refresh_history()
{
    const intro = document.getElementById('history-intro');
    const body = document.getElementById('history-body');
    const runs = state.history;
    const solved = Object.keys(state.solved).length;
    if (!runs.length) {
        intro.textContent = '';
        body.innerHTML = '<div class="history-empty">Nothing submitted yet. Every time you submit a topic, it shows here: when, which topic, in which language, how many tests passed and the code you submitted. Run tries the code and keeps nothing.</div>';
        return;
    }
    intro.textContent = `${format_count(runs.length, 'submission', 'submissions')}, newest first; ${format_count(solved, 'topic solved', 'topics solved')}. A row opens the code submitted.`;
    const rows = [];
    for (const run of runs) {
        const topic = topic_by_uid[run.topic_uid];
        const is_pass = (run.passed === run.total);
        const is_open = (run.time === history_open_time);
        rows.push(`<tr class="history-row${is_open ? ' is-open' : ''}" data-run="${esc(run.time)}"><td class="history-when">${esc(format_time(run.time))}</td><td>${esc(topic.title)}<br><span style="color:var(--muted);font-size:12px">${esc(topic.group)}</span></td><td>${LANG_NAMES[run.lang]}</td><td><span class="result-pill ${is_pass ? 'is-pass' : 'is-fail'}">${is_pass ? `✓ all ${run.total}` : `${run.passed} of ${run.total}`}</span></td></tr>`);
        if (is_open) {
            rows.push(`<tr class="history-detail"><td colspan="4"><div class="mono" style="max-height:none">${esc(run.code)}</div><div class="history-actions"><button class="btn" data-action="open" data-time="${esc(run.time)}">Open the topic</button><button class="btn" data-action="use" data-time="${esc(run.time)}">Put this code in the editor</button></div></td></tr>`);
        }
    }
    body.innerHTML = `<table class="history-table"><thead><tr><th>When</th><th>Topic</th><th>Language</th><th>Tests</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
}
</script>
</body>
</html>
