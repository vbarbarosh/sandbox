<title>Practice</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f766e'/%3E%3Cg stroke='%23fff' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M16 9v5M16 14l-6 6M16 14l6 6'/%3E%3C/g%3E%3Cg fill='%23fff'%3E%3Ccircle cx='16' cy='8' r='3'/%3E%3Ccircle cx='9' cy='22' r='3'/%3E%3Ccircle cx='23' cy='22' r='3'/%3E%3C/g%3E%3C/svg%3E">
<script>
    /* the theme is on <html> before anything is drawn: the choice this page and the sandbox share, else the OS
       setting once, saved there for the sandbox to open in too */
    (function () {
        let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
            const saved = localStorage.getItem('codesandbox_theme');
            if ((saved === 'light') || (saved === 'dark')) {
                theme = saved;
            }
            else {
                localStorage.setItem('codesandbox_theme', theme);
            }
        }
        catch {
        }
        document.documentElement.dataset.theme = theme;
    })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
    :root {
        --bg: #f4f1ea;
        --surface: #fffdf8;
        --surface-2: #f8f5ee;
        --ink: #1d2a2e;
        --muted: #66737a;
        --line: #e2dccf;
        --line-strong: #cfc7b6;
        --accent: #0f766e;
        --accent-ink: #ffffff;
        --accent-soft: #d7eee9;
        --ok: #15803d;
        --ok-soft: #dcf1e2;
        --bad: #b42318;
        --bad-soft: #f9e1dd;
        --warn: #a15c07;
        --warn-soft: #f7ead2;
        --code-bg: #f1ece1;
        --node: #ffffff;
        --edge: #a9a08d;
        --shadow: 0 1px 2px rgba(40, 30, 10, 0.06), 0 4px 16px rgba(40, 30, 10, 0.05);
        --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-head: 'Source Serif 4', Georgia, 'Times New Roman', serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    }

    :root[data-theme="dark"] {
        --bg: #111719;
        --surface: #182124;
        --surface-2: #1e292d;
        --ink: #e4ebec;
        --muted: #91a0a5;
        --line: #2a383c;
        --line-strong: #3b4c51;
        --accent: #2cc5b0;
        --accent-ink: #0b1a18;
        --accent-soft: #143a36;
        --ok: #4cd481;
        --ok-soft: #173226;
        --bad: #f47a6e;
        --bad-soft: #3a1d1b;
        --warn: #e8a64a;
        --warn-soft: #3a2a14;
        --code-bg: #131b1e;
        --node: #1e292d;
        --edge: #56676c;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        height: 100%;
    }

    body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 var(--font-ui);
    }

    button {
        font: inherit;
        color: inherit;
    }

    code {
        font-family: var(--font-mono);
        font-size: 0.92em;
        background: var(--code-bg);
        border-radius: 3px;
        padding: 0 4px;
    }

    [hidden] {
        display: none !important;
    }

    .topbar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 18px;
        height: 56px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
    }

    .brand-name {
        font: 700 20px/1 var(--font-head);
        letter-spacing: -0.01em;
    }

    .brand-note {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
    }

    .tabs {
        display: flex;
        gap: 2px;
        padding: 3px;
        border-radius: 6px;
        background: var(--surface-2);
        border: 1px solid var(--line);
    }

    .tab {
        border: 0;
        background: transparent;
        padding: 5px 14px;
        border-radius: 4px;
        cursor: pointer;
        color: var(--muted);
        font-weight: 500;
    }

    .tab.is-on {
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--shadow);
    }

    .progress {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
    }

    .progress-bar {
        width: 120px;
        height: 6px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        background: var(--ok);
        transition: width 0.3s;
    }

    .spacer {
        flex: 1;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 32px;
        padding: 0 12px;
        border: 1px solid var(--line-strong);
        border-radius: 4px;
        background: var(--surface);
        cursor: pointer;
        white-space: nowrap;
    }

    .btn:hover {
        border-color: var(--accent);
    }

    .btn:disabled {
        opacity: 0.5;
        cursor: default;
    }

    .btn-main {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
    }

    .btn-icon {
        width: 32px;
        padding: 0;
        justify-content: center;
    }

    .kbd {
        font: 11px var(--font-mono);
        opacity: 0.75;
    }

    .shell {
        position: relative;
        flex: 1;
        display: flex;
        min-height: 0;
    }

    /* the way back to the sandbox, its </> on blue as in the sandbox's own top bar */
    .sandbox-link {
        color: var(--ink);
        text-decoration: none;
    }

    .sandbox-mark {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        border-radius: 4px;
        background: #3b82f6;
        color: #ffffff;
        font: 700 10px var(--font-mono);
    }

    /* every group has a colour of its own, from its --hue: its card, its tag, the topic's head */
    .group-tinted {
        --group: hsl(var(--hue) 62% 36%);
        --group-soft: hsl(var(--hue) 55% 92%);
    }

    :root[data-theme="dark"] .group-tinted {
        --group: hsl(var(--hue) 70% 68%);
        --group-soft: hsl(var(--hue) 35% 19%);
    }

    .catalog {
        max-width: 1500px;
        margin: 0 auto;
    }

    .catalog-head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
    }

    .catalog-intro {
        min-width: 0;
        max-width: 760px;
    }

    .catalog-intro .brief {
        margin-bottom: 0;
        color: var(--muted);
    }

    .next-card {
        display: grid;
        gap: 2px;
        min-width: 260px;
        max-width: 420px;
        padding: 12px 16px;
        border: 1px solid var(--group);
        border-left-width: 5px;
        border-radius: 6px;
        background: var(--group-soft);
        cursor: pointer;
        text-align: left;
    }

    .next-card:hover {
        box-shadow: var(--shadow);
    }

    .next-label {
        color: var(--group);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    .next-title {
        font: 700 19px/1.25 var(--font-head);
        overflow-wrap: anywhere;
    }

    .next-note {
        color: var(--muted);
        font-size: 13px;
    }

    .search {
        width: 100%;
        max-width: 520px;
        height: 38px;
        margin-bottom: 18px;
        padding: 0 12px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: 15px;
    }

    .search:focus {
        outline: 2px solid var(--accent-soft);
        border-color: var(--accent);
    }

    /* groups flow down columns as wide as fit, each card whole in one of them */
    .topic-list {
        column-width: 320px;
        column-gap: 16px;
    }

    .group-card {
        break-inside: avoid;
        margin-bottom: 16px;
        padding: 12px 10px 8px;
        border: 1px solid var(--line);
        border-top: 4px solid var(--group);
        border-radius: 6px;
        background: var(--surface);
        box-shadow: var(--shadow);
    }

    .group-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding: 0 8px;
    }

    .group-title {
        color: var(--group);
        font: 700 17px/1.3 var(--font-head);
    }

    .group-count {
        flex: none;
        color: var(--muted);
        font-size: 12px;
    }

    .group-bar {
        height: 4px;
        margin: 8px 8px 6px;
        border-radius: 2px;
        background: var(--group-soft);
        overflow: hidden;
    }

    .group-fill {
        height: 100%;
        background: var(--group);
    }

    .topic-link {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 8px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
        text-align: left;
    }

    .topic-link:hover {
        background: var(--surface);
    }

    .topic-link.is-on {
        background: var(--group-soft);
        font-weight: 600;
    }

    /* the first match of a search: Enter opens it */
    .topic-link.is-first {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
    }

    .topic-mark {
        flex: none;
        width: 16px;
        height: 16px;
        border: 1.5px solid var(--line-strong);
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 10px;
        line-height: 1;
    }

    .topic-mark.is-solved {
        border-color: var(--ok);
        background: var(--ok);
        color: var(--surface);
    }

    .topic-mark.is-other {
        border-color: var(--ok);
        color: var(--ok);
    }

    .topic-name {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
    }

    .level {
        flex: none;
        display: inline-flex;
        gap: 2px;
    }

    .level i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--line-strong);
    }

    .level.is-1 i.is-on {
        background: var(--ok);
    }

    .level.is-2 i.is-on {
        background: var(--warn);
    }

    .level.is-3 i.is-on {
        background: var(--bad);
    }

    .list-empty {
        margin: 24px 12px;
        color: var(--muted);
    }

    .view {
        flex: 1;
        min-width: 0;
        overflow: auto;
        padding: 22px 26px 40px;
    }

    .crumbs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
    }

    .tag {
        padding: 1px 8px;
        border-radius: 3px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        font-size: 12px;
    }

    .tag-ok {
        background: var(--ok-soft);
        border-color: transparent;
        color: var(--ok);
    }

    .tag-group {
        background: var(--group-soft);
        border-color: transparent;
        color: var(--group);
        font-weight: 600;
    }

    .tag-level.is-1 {
        color: var(--ok);
    }

    .tag-level.is-2 {
        color: var(--warn);
    }

    .tag-level.is-3 {
        color: var(--bad);
    }

    h1 {
        margin: 6px 0 6px;
        font: 700 32px/1.15 var(--font-head);
        letter-spacing: -0.015em;
        overflow-wrap: anywhere;
    }

    .brief {
        max-width: 900px;
        margin: 0 0 18px;
        font-size: 16px;
    }

    /* a topic fills the window: its code on the left, the rest on the right, the bar between them drags */
    .view-topic {
        display: flex;
        flex-direction: column;
        padding-bottom: 18px;
    }

    .topic-bar {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        margin-bottom: 14px;
    }

    .back-btn {
        flex: none;
    }

    .topic-title {
        min-width: 0;
        margin: 0;
        font-size: 24px;
    }

    .split {
        --split-left: 1fr;
        --split-right: 1fr;
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, var(--split-left)) 12px minmax(0, var(--split-right));
        min-height: 460px;
    }

    .split > .split-pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        margin-bottom: 0;
    }

    /* a line in the middle of a wider grip, the accent while held */
    .split-bar {
        position: relative;
        cursor: col-resize;
        touch-action: none;
    }

    .split-bar::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 5px;
        width: 2px;
        border-radius: 1px;
        background: transparent;
    }

    .split-bar:hover::before,
    .split-bar:focus-visible::before,
    .split-bar.is-held::before {
        background: var(--accent);
    }

    .split-bar:focus-visible {
        outline: none;
    }

    .split-bar::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 3px;
        width: 6px;
        height: 28px;
        margin-top: -14px;
        border: 1px solid var(--line-strong);
        border-radius: 3px;
        background: var(--surface-2);
    }

    body.is-splitting {
        cursor: col-resize;
        user-select: none;
    }

    .pane-bar {
        flex: none;
        display: flex;
        align-items: center;
        padding: 0 8px;
        border-bottom: 1px solid var(--line);
    }

    .pane-tabs {
        display: flex;
        gap: 4px;
        align-self: stretch;
    }

    .pane-tab {
        margin-bottom: -1px;
        padding: 10px 12px 8px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-weight: 600;
    }

    .pane-tab:hover {
        color: var(--ink);
    }

    .pane-tab.is-on {
        border-bottom-color: var(--accent);
        color: var(--ink);
    }

    .pane-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 14px;
    }

    .pane-body .brief {
        margin-bottom: 14px;
    }

    .part + .part {
        margin-top: 16px;
    }

    .part-head {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
    }

    .pane-tests {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    #task-diagram .diagram {
        max-height: 420px;
        margin-bottom: 0;
    }

    .explain-part {
        margin-top: 12px;
    }

    .sources {
        margin: 0;
        padding-left: 18px;
    }

    .sources li + li {
        margin-top: 4px;
    }

    .sources a {
        color: var(--accent);
        overflow-wrap: anywhere;
    }

    .card {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        box-shadow: var(--shadow);
        margin-bottom: 14px;
        overflow: hidden;
    }

    .card-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        font-weight: 600;
    }

    .card-body {
        padding: 12px 14px;
    }

    .card-body p {
        margin: 0 0 10px;
    }

    .card-body p:last-child {
        margin-bottom: 0;
    }

    .rules {
        margin: 0;
        padding-left: 18px;
    }

    .example {
        margin: 10px 0 0;
        padding: 10px 12px;
        border-left: 3px solid var(--accent);
        background: var(--surface-2);
        border-radius: 0 4px 4px 0;
        white-space: pre-wrap;
    }

    .example-label {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 2px;
    }

    .mono {
        margin: 8px 0 0;
        padding: 10px 12px;
        background: var(--code-bg);
        border-radius: 4px;
        font: 12.5px/1.5 var(--font-mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 340px;
        overflow: auto;
    }

    .hint {
        margin: 0 0 8px;
        padding: 8px 10px;
        border-radius: 4px;
        background: var(--warn-soft);
    }

    .link-btn {
        border: 0;
        background: none;
        color: var(--accent);
        cursor: pointer;
        padding: 0;
        font-weight: 500;
    }

    .lang-tabs {
        display: flex;
        gap: 2px;
    }

    .lang-tab {
        border: 1px solid transparent;
        background: transparent;
        border-radius: 4px;
        padding: 3px 10px;
        cursor: pointer;
        color: var(--muted);
        font-weight: 500;
    }

    .lang-tab.is-on {
        border-color: var(--line-strong);
        background: var(--surface-2);
        color: var(--ink);
    }

    .lang-tab:disabled {
        cursor: default;
        opacity: 0.45;
    }

    .head-note {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
        text-align: right;
    }

    .editor-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
        border-bottom: 1px solid var(--line);
    }

    .CodeMirror {
        position: absolute;
        inset: 0;
        height: 100%;
        font: 13.5px/1.55 var(--font-mono);
        background: var(--surface);
        color: var(--ink);
    }

    .CodeMirror-gutters {
        background: var(--surface-2);
        border-right: 1px solid var(--line);
    }

    .CodeMirror-linenumber {
        color: var(--muted);
    }

    .CodeMirror-cursor {
        border-left-color: var(--ink);
    }

    .CodeMirror-selected,
    .CodeMirror-focused .CodeMirror-selected {
        background: var(--accent-soft);
    }

    .CodeMirror-matchingbracket {
        color: var(--accent) !important;
        text-decoration: underline;
    }

    .cm-keyword {
        color: #8b3fa8;
    }

    .cm-def,
    .cm-variable-2 {
        color: #1d5fa8;
    }

    .cm-string,
    .cm-string-2 {
        color: #2f7d32;
    }

    .cm-number,
    .cm-atom {
        color: #b45309;
    }

    .cm-comment {
        color: var(--muted);
        font-style: italic;
    }

    .cm-meta {
        color: var(--muted);
    }

    :root[data-theme="dark"] .cm-keyword {
        color: #d39bf0;
    }

    :root[data-theme="dark"] .cm-def,
    :root[data-theme="dark"] .cm-variable-2 {
        color: #7fb8f5;
    }

    :root[data-theme="dark"] .cm-string,
    :root[data-theme="dark"] .cm-string-2 {
        color: #93d49a;
    }

    :root[data-theme="dark"] .cm-number,
    :root[data-theme="dark"] .cm-atom {
        color: #f0b46a;
    }

    .run-bar {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 12px;
        padding: 10px 14px;
    }

    .run-summary {
        flex: 1 1 160px;
        color: var(--muted);
        overflow-wrap: anywhere;
    }

    .run-summary.is-pass {
        color: var(--ok);
        font-weight: 600;
    }

    .run-summary.is-fail {
        color: var(--bad);
        font-weight: 600;
    }

    .case-chips {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
    }

    .chips-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
    }

    .chips-label + .case-chip {
        margin-left: 2px;
    }

    .case-chip + .chips-label {
        margin-left: 10px;
    }

    .case-chip {
        min-width: 30px;
        height: 28px;
        padding: 0 7px;
        border: 1px solid var(--line-strong);
        border-radius: 4px;
        background: var(--surface-2);
        color: var(--ink);
        cursor: pointer;
        font: 600 12.5px/1 var(--font-mono);
    }

    .case-chip:hover {
        border-color: var(--accent);
    }

    .case-chip.is-pass {
        border-color: var(--ok);
        background: var(--ok-soft);
        color: var(--ok);
    }

    .case-chip.is-fail,
    .case-chip.is-error,
    .case-chip.is-timeout {
        border-color: var(--bad);
        background: var(--bad-soft);
        color: var(--bad);
    }

    .case-chip.is-running {
        border-color: var(--warn);
        background: var(--warn-soft);
        color: var(--warn);
    }

    .case-chip.is-on {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
    }

    .case-detail {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: auto;
        padding: 12px 14px;
    }

    .detail-title {
        margin: 0 0 8px;
        font-weight: 600;
        overflow-wrap: anywhere;
    }

    .detail-input {
        margin-top: 14px;
    }

    .detail-note {
        margin: 0 0 8px;
        color: var(--muted);
    }

    .message {
        margin: 0 0 10px;
        padding: 8px 10px;
        border-radius: 4px;
        background: var(--bad-soft);
        color: var(--bad);
        overflow-wrap: anywhere;
        white-space: pre-wrap;
    }

    .diagram {
        border: 1px solid var(--line);
        border-radius: 4px;
        background-color: var(--surface-2);
        background-image: radial-gradient(var(--line) 1px, transparent 1px);
        background-size: 16px 16px;
        overflow: auto;
        max-height: 300px;
        margin-bottom: 10px;
    }

    .diagram svg {
        display: block;
        margin: 0 auto;
    }

    .diagram-note {
        padding: 10px;
        color: var(--muted);
        font-size: 13px;
    }

    .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .pair.is-stacked {
        grid-template-columns: 1fr;
    }

    .pair .diagram {
        margin: 4px 0 6px;
    }

    details summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
    }

    .pair-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
    }

    .pair .mono {
        margin-top: 4px;
        max-height: 220px;
    }

    .mono.is-pass {
        box-shadow: inset 3px 0 0 var(--ok);
    }

    .mono.is-fail {
        box-shadow: inset 3px 0 0 var(--bad);
    }

    .logs {
        margin-top: 10px;
    }

    .history-intro {
        margin: 0 0 16px;
        color: var(--muted);
    }

    .history-table {
        width: 100%;
        max-width: 1100px;
        border-collapse: collapse;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        box-shadow: var(--shadow);
    }

    .history-table th {
        text-align: left;
        padding: 9px 12px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
        background: var(--surface-2);
    }

    .history-table td {
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        overflow-wrap: anywhere;
    }

    .history-row {
        cursor: pointer;
    }

    .history-row:hover td {
        background: var(--surface-2);
    }

    .history-row.is-open td {
        background: var(--accent-soft);
    }

    .result-pill {
        display: inline-block;
        padding: 1px 9px;
        border-radius: 3px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
    }

    .result-pill.is-pass {
        background: var(--ok-soft);
        color: var(--ok);
    }

    .result-pill.is-fail {
        background: var(--bad-soft);
        color: var(--bad);
    }

    .history-when {
        white-space: nowrap;
        color: var(--muted);
    }

    .history-detail td {
        background: var(--surface-2);
    }

    .history-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
    }

    .history-empty {
        max-width: 640px;
        padding: 28px;
        border: 1px dashed var(--line-strong);
        border-radius: 6px;
        color: var(--muted);
    }

    .drop-veil {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(15, 118, 110, 0.16);
        border: 3px dashed var(--accent);
        font: 600 20px var(--font-ui);
        color: var(--accent);
        z-index: 20;
        pointer-events: none;
    }

    .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 14px;
        max-width: min(640px, calc(100vw - 32px));
        padding: 10px 16px;
        border-radius: 6px;
        background: var(--ink);
        color: var(--surface);
        box-shadow: var(--shadow);
        z-index: 30;
    }

    .toast .link-btn {
        color: var(--accent-soft);
    }

    @media (max-width: 1100px) {
        /* one panel under the other, nothing to drag */
        .split {
            flex: none;
            grid-template-columns: minmax(0, 1fr);
            gap: 14px;
        }

        .split-bar {
            display: none;
        }

        .pane-body {
            flex: none;
        }

        /* the buttons go to a second row rather than past the window's edge */
        .topbar {
            flex-wrap: wrap;
            height: auto;
            padding: 8px 12px;
            gap: 10px;
        }

        .editor-wrap {
            flex: none;
            height: 360px;
        }

        .case-detail {
            flex: none;
        }

        .brand-note {
            display: none;
        }
    }

    @media (max-width: 760px) {
        .topbar {
            flex-wrap: wrap;
            height: auto;
            padding: 8px 12px;
            gap: 10px;
        }

        .view {
            padding: 16px;
        }

        .pair {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

    <a class="btn sandbox-link" href="index.html" title="Back to the sandbox; each Submit is a file of its workspace Practice"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span class="sandbox-mark">&lt;/&gt;</span>Sandbox</a>

<div class="shell" id="shell">
    <main class="view" id="catalog-view">

    <main class="view view-topic" id="topic-view" hidden>
        <div class="topic-bar">

        <div class="split" id="split">

</div>
<input type="file" id="load-input" accept=".json,application/json" hidden>
<div class="drop-veil" id="drop-veil" hidden>Drop a file saved by Save all to load it</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
